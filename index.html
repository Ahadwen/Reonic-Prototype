<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice to Components</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="workspace">
          <div class="avatar">BH</div>
          <div>
            <div class="ws-name">Brightwell Heat &amp; Solar</div>
            <div class="ws-sub">Demo installer</div>
          </div>
        </div>
        <nav>
          <div class="nav-group">Company</div>
          <a href="#components" data-nav="components">Components <span id="nav-count" class="count"></span></a>
          <a href="#import" data-nav="import">Import from invoice <span class="new-badge">New</span></a>
        </nav>
        <div class="sidebar-foot">
          <details>
            <summary>Use your own API key</summary>
            <input id="api-key" type="password" placeholder="sk-ant-… (optional)" autocomplete="off" />
            <label class="check"><input id="remember-key" type="checkbox" /> Remember in this browser</label>
            <p class="hint">Not needed: the demo calls Claude through a server with its own key. A key pasted here goes only to api.anthropic.com.</p>
          </details>
          <button id="reset" class="link">Reset demo data</button>
        </div>
      </aside>
      <main id="app"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
